services:
  postgres:
    image: postgres:16-alpine
    container_name: dog-booking-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dog_booking
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dog-booking-backend
    restart: unless-stopped
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/dog_booking
      CLIENT_ORIGIN: http://localhost:5173
      JWT_SECRET: change-me-in-production-1234567890
      JWT_EXPIRES_IN: 7d
      STORAGE_PROVIDER: s3
      AWS_REGION: us-east-1
      AWS_S3_BUCKET: ""
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
      GCP_PROJECT_ID: ""
      GCP_BUCKET: ""
      GCP_KEY_FILE: ""
    ports:
      - "4000:4000"

volumes:
  postgres_data:
