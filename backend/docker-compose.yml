services:
  postgres:
    image: postgres:16-alpine
    container_name: dog-booking-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dog_booking
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dog_booking"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: dog-booking-backend
    command:
      - sh
      - -c
      - |
        set -eu
        cleanup() {
          trap - INT TERM EXIT
          kill "$$compiler_pid" "$$server_pid" 2>/dev/null || true
          wait "$$compiler_pid" "$$server_pid" 2>/dev/null || true
        }
        pnpm exec prisma migrate deploy
        pnpm run build
        pnpm exec tsc --watch --preserveWatchOutput &
        compiler_pid=$$!
        node --watch dist/main.js &
        server_pid=$$!
        trap cleanup INT TERM EXIT
        set +e
        wait "$$server_pid"
        exit_code=$$?
        set -e
        cleanup
        exit "$$exit_code"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/dog_booking
      CLIENT_ORIGIN: http://localhost:5173
    ports:
      - "3000:3000"
    volumes:
      - uploads_data:/app/uploads
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
          initial_sync: true
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ../pnpm-lock.yaml
        - action: rebuild
          path: ./prisma
        - action: rebuild
          path: ./tsconfig.json
        - action: rebuild
          path: ./Dockerfile

volumes:
  postgres_data:
  uploads_data:
