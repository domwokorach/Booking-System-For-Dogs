services:
  postgres:
    image: postgres:16-alpine
    container_name: dog-booking-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dog_booking
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dog_booking"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dog-booking-backend
    command: ["sh", "-c", "npx prisma migrate deploy && npm run dev"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/dog_booking
      CLIENT_ORIGIN: http://localhost:5173
    ports:
      - "4000:4000"
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
          initial_sync: true
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./prisma
        - action: rebuild
          path: ./tsconfig.json
        - action: rebuild
          path: ./Dockerfile

volumes:
  postgres_data:
