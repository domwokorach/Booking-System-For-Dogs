name: Refresh Pawside weather safety

on:
  schedule:
    # Offset from the start of the hour to reduce scheduler congestion.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

concurrency:
  group: pawside-weather-refresh
  cancel-in-progress: true

permissions: {}

jobs:
  refresh-weather:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Refresh weather and process safety notifications
        env:
          CRON_SECRET: ${{ secrets.PAWSIDE_CRON_SECRET }}
          WEATHER_REFRESH_URL: https://booking-system-for-dogs-backend.vercel.app/api/weather/refresh
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "PAWSIDE_CRON_SECRET is not configured."
            exit 1
          fi

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 2 \
            --max-time 30 \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$WEATHER_REFRESH_URL"
